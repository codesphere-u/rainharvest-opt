[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "rainharvest-opt"
version = "0.1.0"
description = "Zero-dependency Yield-After-Spillage (YAS) rainwater harvesting tank simulator, first-flush diverter sizing, dry-season reliability auditor, and optimal cistern-size curve optimizer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "rainwater-harvesting",
    "water-security",
    "wash",
    "hydrology",
    "yield-after-spillage",
    "tank-sizing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
rainharvest-opt = "rainharvest_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rainharvest_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
